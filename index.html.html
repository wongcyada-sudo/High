<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夢女與夢角 · 字卡傳訊</title>
<style>
:root{
  --bg:#faf6f0;--panel:#ffffff;--text:#3a3330;--text-sub:#9a8f88;
  --user-bubble:#c9e6b8;--user-text:#2f3a2a;--dream-bubble:#ffffff;--dream-text:#3a3330;
  --btn:#c98b8b;--btn-text:#fff;--input-bg:#f2ece5;--input-text:#3a3330;
  --avatar-border:#e6dcd2;--typing-bg:#f2ece5;--typing-text:#9a8f88;
  --nav-bg:#fffdfa;--divider:#eee6dd;--accent:#c98b8b;
  --tarot-bg:#f4ece2;--tarot-card:#fffdf8;--tarot-accent:#c98b8b;--tarot-gold:#c9a35c;--tarot-text:#3a3330;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --shadow-sm:0 1px 2px rgba(60,50,45,.04),0 2px 8px rgba(60,50,45,.04);
  --shadow-md:0 2px 6px rgba(60,50,45,.06),0 8px 24px rgba(60,50,45,.07);
  --shadow-lg:0 8px 32px rgba(60,50,45,.14);
  --radius:16px;--radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  transition:background .35s ease,color .35s ease;
}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t);padding-bottom:var(--safe-b);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;transition:transform .12s ease,opacity .15s ease,background .2s ease;}
button:active{transform:scale(.96);}
input,textarea{font-family:inherit;font-size:16px;touch-action:manipulation;}
input:focus,textarea:focus{outline:none;}
.hidden{display:none!important;}

/* ===== 导航栏 ===== */
#nav{
  height:56px;min-height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:color-mix(in srgb,var(--nav-bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--divider);z-index:20;transition:background .35s ease;
}
#nav .nav-back{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text);}
#nav .nav-back:active{background:var(--input-bg);}
#nav .nav-title{font-size:17px;font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;}
#nav .nav-account{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-sub);max-width:90px;padding:5px 10px;border-radius:20px;background:var(--input-bg);transition:background .35s ease;}
#nav .nav-account span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#nav .dot{width:7px;height:7px;border-radius:50%;background:#5fc46a;flex-shrink:0;box-shadow:0 0 0 3px rgba(95,196,106,.18);}

/* ===== 页面容器 ===== */
.page{flex:1;overflow:hidden;display:none;flex-direction:column;position:relative;}
.page.active{display:flex;animation:pageIn .28s ease;}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ===== 主页 ===== */
#homeList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 110px;}
.dream-card{
  display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:var(--radius);
  background:var(--panel);margin-bottom:11px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-sm);border:1px solid color-mix(in srgb,var(--divider) 60%,transparent);
  transition:transform .16s ease,box-shadow .2s ease,background .35s ease;
}
.dream-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.55;}
.dream-card:active{transform:scale(.985);box-shadow:var(--shadow-md);}
.dream-avatar{
  width:52px;height:52px;border-radius:16px;background:var(--input-bg);overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent),var(--shadow-sm);
}
.dream-avatar img{width:100%;height:100%;object-fit:cover;}
.dream-avatar .ph{font-size:21px;color:var(--text-sub);opacity:.6;}
.dream-info{flex:1;min-width:0;}
.dream-name{font-weight:700;font-size:15.5px;margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.dream-preview{font-size:12.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dream-badge{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 40%,transparent);}
.home-empty{text-align:center;color:var(--text-sub);padding:70px 20px;font-size:14px;line-height:1.9;}
.home-empty svg{opacity:.35;margin-bottom:14px;}

/* 主页底部按钮区 */
.home-fab-bar{
  position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;z-index:15;
}
.fab{
  width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,var(--btn),color-mix(in srgb,var(--btn) 78%,#000));
  color:var(--btn-text);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px color-mix(in srgb,var(--btn) 45%,transparent),0 2px 6px rgba(0,0,0,.1);
}
.fab:active{transform:scale(.92);}
.fab.fab-plain{
  width:46px;height:46px;background:var(--panel);color:var(--text-sub);
  box-shadow:var(--shadow-md);border:1px solid var(--divider);
}
.fab.fab-plain:active{color:var(--accent);}
.home-hint{position:absolute;left:14px;bottom:calc(26px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--text-sub);max-width:55%;}

/* ===== 聊天页 ===== */
#chatTop{
  display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--nav-bg);
  border-bottom:1px solid var(--divider);transition:background .35s ease;
}
.top-avatar{
  width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--input-bg);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent);
}
.top-avatar img{width:100%;height:100%;object-fit:cover;}
.top-avatar .ph{font-size:18px;color:var(--text-sub);opacity:.6;}
.top-name{font-size:11.5px;color:var(--text-sub);max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;margin-top:3px;font-weight:600;}
.top-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;cursor:pointer;}
.top-heart{flex-shrink:0;opacity:.85;filter:drop-shadow(0 1px 2px rgba(201,139,139,.2));}
.func-strip{display:flex;gap:6px;margin-left:auto;align-items:center;flex-shrink:0;}
.func-btn{
  width:25px;height:25px;border-radius:8px;background:var(--input-bg);color:var(--btn);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.04);
}
.func-btn:active{transform:scale(.88);background:color-mix(in srgb,var(--btn) 16%,var(--input-bg));}
.func-btn svg{width:14px;height:14px;}

#msgList{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 10px;
  background-size:contain;background-repeat:no-repeat;background-position:center;
  transition:background .35s ease;
}
.day-divider{text-align:center;color:var(--text-sub);font-size:11px;margin:16px 0 12px;letter-spacing:.5px;}
.day-divider span{background:color-mix(in srgb,var(--panel) 70%,transparent);padding:3px 12px;border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.sys-msg{text-align:center;margin:12px 0;}
.sys-msg span{display:inline-block;background:color-mix(in srgb,var(--text-sub) 13%,transparent);color:var(--text-sub);font-size:11.5px;padding:5px 14px;border-radius:12px;letter-spacing:.3px;}

.msg-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:14px;animation:msgIn .22s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.msg-row.user{flex-direction:row-reverse;}
.msg-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--input-bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 15%,transparent);}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.msg-avatar .ph{font-size:15px;color:var(--text-sub);opacity:.6;}
.msg-body{max-width:72%;display:flex;flex-direction:column;}
.msg-row.user .msg-body{align-items:flex-end;}
.msg-meta{font-size:10.5px;color:var(--text-sub);margin-bottom:4px;display:flex;gap:6px;align-items:center;opacity:.9;}
.msg-row.user .msg-meta{flex-direction:row-reverse;}
.bubble{
  position:relative;padding:9px 13px;border-radius:15px;font-size:14.5px;word-break:break-word;
  white-space:pre-wrap;line-height:1.55;box-shadow:var(--shadow-sm);
  transition:background .35s ease,color .35s ease;
}
.msg-row.dream .bubble{background:var(--dream-bubble);color:var(--dream-text);border-top-left-radius:5px;}
.msg-row.user .bubble{background:var(--user-bubble);color:var(--user-text);border-top-right-radius:5px;}
/* 气泡形状 */
body.shape-tail .msg-row.dream .bubble::after{content:"";position:absolute;left:-5px;top:9px;width:0;height:0;border-top:5px solid transparent;border-right:7px solid var(--dream-bubble);z-index:-1;}
body.shape-tail .msg-row.user .bubble::after{content:"";position:absolute;right:-5px;top:9px;width:0;height:0;border-top:5px solid transparent;border-left:7px solid var(--user-bubble);z-index:-1;}
body.shape-round .bubble{border-radius:18px!important;}
body.shape-capsule .bubble{border-radius:22px!important;}
body.shape-rect .bubble{border-radius:7px!important;}
.star-deco{position:absolute;top:-8px;right:-6px;width:15px;height:15px;color:var(--accent);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--accent) 55%,transparent));}
.quote-block{border-left:2.5px solid var(--accent);padding:5px 9px;margin-bottom:6px;font-size:12px;color:var(--text-sub);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:0 6px 6px 0;line-height:1.4;}
.msg-img{max-width:180px;max-height:180px;border-radius:12px;display:block;box-shadow:var(--shadow-sm);}
.msg-sticker{width:112px;height:112px;object-fit:contain;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.08));}
.msg-status{font-size:10px;color:var(--text-sub);margin-top:4px;opacity:.8;}

/* 打字提示 */
.typing-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:14px;animation:msgIn .2s ease;}
.typing-box{background:var(--typing-bg);color:var(--typing-text);padding:10px 15px;border-radius:15px;border-top-left-radius:5px;font-size:13px;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm);}
.typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--typing-text);margin:0 1.5px;animation:blink 1.3s infinite ease-in-out;}
.typing-dots span:nth-child(2){animation-delay:.18s;}
.typing-dots span:nth-child(3){animation-delay:.36s;}
@keyframes blink{0%,70%,100%{opacity:.25;transform:translateY(0);}35%{opacity:1;transform:translateY(-2px);}}

/* 问卷卡片 */
.survey-card{background:var(--panel);border:1px solid var(--divider);border-radius:var(--radius);padding:13px;min-width:200px;max-width:262px;box-shadow:var(--shadow-sm);}
.survey-title{font-weight:700;font-size:14px;margin-bottom:9px;line-height:1.4;}
.survey-opt{padding:8px 11px;border-radius:10px;background:var(--input-bg);margin-bottom:6px;font-size:13.5px;transition:background .2s ease;}
.survey-opt.picked{background:var(--user-bubble);color:var(--user-text);font-weight:700;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--user-text) 18%,transparent);}
.survey-result{font-size:12px;color:var(--accent);margin-top:6px;font-weight:600;}

/* 输入区 */
#inputBar{
  display:flex;align-items:flex-end;gap:7px;padding:9px 11px calc(9px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--nav-bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);
  border-top:1px solid var(--divider);transition:background .35s ease;
}
.ib-btn{width:38px;height:38px;border-radius:50%;background:var(--input-bg);color:var(--btn);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);}
.ib-btn:active{transform:scale(.9);background:color-mix(in srgb,var(--btn) 14%,var(--input-bg));}
.ib-btn svg{width:19px;height:19px;}
#msgInput{
  flex:1;min-height:38px;max-height:110px;border-radius:19px;background:var(--input-bg);color:var(--input-text);
  border:1px solid transparent;padding:9px 15px;resize:none;font-size:16px;line-height:1.4;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04);transition:border-color .2s ease,box-shadow .2s ease,background .35s ease;
}
#msgInput:focus{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:inset 0 1px 3px rgba(0,0,0,.03),0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);}
#sendBtn{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--btn),color-mix(in srgb,var(--btn) 80%,#000));color:var(--btn-text);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px color-mix(in srgb,var(--btn) 40%,transparent);}
#sendBtn:active{transform:scale(.9);}
#sendBtn svg{width:19px;height:19px;}
#quotePreview{display:flex;align-items:center;gap:8px;padding:7px 14px;background:color-mix(in srgb,var(--accent) 8%,var(--input-bg));font-size:12.5px;color:var(--text-sub);border-top:1px solid var(--divider);animation:pageIn .18s ease;}
#quotePreview .qp-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ===== 字卡库 ===== */
#libTabs{display:flex;background:var(--nav-bg);border-bottom:1px solid var(--divider);padding:0 8px;gap:2px;transition:background .35s ease;}
.lib-tab{flex:1;padding:13px 0;text-align:center;font-size:13.5px;color:var(--text-sub);border-bottom:2.5px solid transparent;transition:color .2s ease,border-color .2s ease;font-weight:500;}
.lib-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:700;}
#libBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:50px;}
.lib-toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;align-items:center;}
.lib-btn{padding:7px 13px;border-radius:10px;background:var(--input-bg);color:var(--text);font-size:12.5px;font-weight:600;transition:background .2s ease,transform .12s ease;}
.lib-btn:active{opacity:.8;transform:scale(.96);}
.lib-btn.primary{background:linear-gradient(145deg,var(--btn),color-mix(in srgb,var(--btn) 82%,#000));color:var(--btn-text);box-shadow:0 2px 8px color-mix(in srgb,var(--btn) 35%,transparent);}
.lib-count{font-size:11.5px;color:var(--text-sub);margin-left:auto;padding:3px 10px;background:var(--input-bg);border-radius:9px;}
.lib-item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--panel);border-radius:var(--radius-sm);margin-bottom:7px;box-shadow:var(--shadow-sm);transition:transform .14s ease,box-shadow .2s ease;}
.lib-item:active{transform:scale(.99);}
.lib-item .li-text{flex:1;font-size:14px;word-break:break-word;line-height:1.45;}
.lib-item input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0;}
.lib-del{width:27px;height:27px;border-radius:50%;background:var(--input-bg);color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:background .2s ease,color .2s ease;}
.lib-del:active{background:color-mix(in srgb,#e05555 16%,var(--input-bg));color:#e05555;}
.lib-thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--input-bg);flex-shrink:0;}
.lib-empty{text-align:center;color:var(--text-sub);padding:48px 20px;font-size:13.5px;line-height:1.8;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--divider);gap:12px;}
.setting-label{font-size:14px;font-weight:600;}
.setting-sub{font-size:11.5px;color:var(--text-sub);margin-top:3px;line-height:1.4;}
.switch{width:46px;height:27px;border-radius:14px;background:var(--input-bg);position:relative;transition:background .25s ease;flex-shrink:0;border:1px solid var(--divider);cursor:pointer;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.4,1.4,.6,1);box-shadow:0 1px 4px rgba(0,0,0,.22);}
.switch.on::after{left:21px;}
.setting-num{width:66px;padding:7px 9px;border-radius:9px;border:1px solid var(--divider);background:var(--input-bg);color:var(--input-text);text-align:center;font-size:16px;}
.setting-slider{flex:1;accent-color:var(--accent);height:6px;}
.setting-val{font-size:12.5px;color:var(--text-sub);min-width:46px;text-align:right;font-weight:600;}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(30,25,22,.44);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--panel);color:var(--text);border-radius:22px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 20px;animation:pop .22s cubic-bezier(.4,1.3,.6,1);box-shadow:var(--shadow-lg);position:relative;transition:background .35s ease;}
@keyframes pop{from{transform:scale(.94) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.modal::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--divider);}
.modal h3{margin:6px 0 16px;font-size:17.5px;font-weight:700;letter-spacing:.3px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions button{flex:1;padding:12px;border-radius:13px;font-size:15px;font-weight:600;background:var(--input-bg);color:var(--text);transition:transform .12s ease,opacity .15s ease;}
.modal-actions button:active{opacity:.8;transform:scale(.98);}
.modal-actions button.primary{background:linear-gradient(145deg,var(--btn),color-mix(in srgb,var(--btn) 82%,#000));color:var(--btn-text);box-shadow:0 3px 12px color-mix(in srgb,var(--btn) 38%,transparent);}
.modal-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--divider);background:var(--input-bg);color:var(--input-text);margin-bottom:11px;transition:border-color .2s ease,box-shadow .2s ease,background .35s ease;}
.modal-input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent);}
.modal-label{font-size:12.5px;color:var(--text-sub);margin:13px 0 7px;font-weight:600;}
.profile-avatar-edit{width:88px;height:88px;border-radius:50%;margin:4px auto 6px;background:var(--input-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent),var(--shadow-sm);cursor:pointer;}
.profile-avatar-edit img{width:100%;height:100%;object-fit:cover;}
.profile-avatar-edit .ph{font-size:32px;color:var(--text-sub);opacity:.6;}
.avatar-hint{text-align:center;font-size:11.5px;color:var(--text-sub);margin-bottom:14px;}

/* 主题网格 */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px;}
.theme-swatch{border-radius:14px;padding:11px 6px;text-align:center;font-size:11.5px;border:2px solid transparent;cursor:pointer;transition:transform .14s ease,border-color .2s ease;font-weight:600;}
.theme-swatch:active{transform:scale(.96);}
.theme-swatch.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}
.theme-dot{width:32px;height:32px;border-radius:50%;margin:0 auto 7px;border:2px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.1);}
.color-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;}
.color-row input[type=color]{width:46px;height:32px;border:none;background:none;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;}
.shape-row{display:flex;gap:8px;flex-wrap:wrap;}
.shape-opt{padding:9px 15px;border-radius:11px;background:var(--input-bg);font-size:12.5px;border:2px solid transparent;font-weight:600;transition:border-color .2s ease;}
.shape-opt.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);}

/* 表情选择器 */
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.sticker-grid img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--input-bg);border-radius:12px;padding:5px;cursor:pointer;transition:transform .14s ease;}
.sticker-grid img:active{transform:scale(.94);}

/* 塔罗 */
#tarotLayer{position:fixed;inset:0;z-index:200;background:var(--tarot-bg);color:var(--tarot-text);display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transition:background .35s ease;}
.tarot-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--tarot-text) 10%,transparent);display:flex;align-items:center;justify-content:center;z-index:5;}
.tarot-title{text-align:center;font-size:21px;font-weight:800;color:var(--tarot-accent);margin:18px 0 6px;letter-spacing:2px;}
.tarot-sub{text-align:center;font-size:12.5px;color:var(--tarot-text);opacity:.65;margin-bottom:22px;}
.tarot-opts{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
.tarot-opt{padding:12px 22px;border-radius:13px;background:var(--tarot-card);border:2px solid transparent;font-size:13.5px;color:var(--tarot-text);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:border-color .2s ease,transform .14s ease;}
.tarot-opt:active{transform:scale(.97);}
.tarot-opt.active{border-color:var(--tarot-gold);}
.tarot-input{width:100%;max-width:340px;margin:0 auto 20px;display:block;padding:13px;border-radius:13px;border:1.5px solid var(--tarot-gold);background:var(--tarot-card);color:var(--tarot-text);}
.tarot-btn{display:block;margin:0 auto;padding:14px 38px;border-radius:15px;background:linear-gradient(145deg,var(--tarot-accent),color-mix(in srgb,var(--tarot-accent) 78%,#000));color:#fff;font-size:15px;font-weight:700;box-shadow:0 6px 20px color-mix(in srgb,var(--tarot-accent) 45%,transparent);letter-spacing:1px;}
.tarot-cards{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
.tarot-card-wrap{perspective:900px;width:112px;height:172px;cursor:pointer;}
.tarot-card-inner{position:relative;width:100%;height:100%;transition:transform .75s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
.tarot-card-wrap.flipped .tarot-card-inner{transform:rotateY(180deg);}
.tarot-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.15);}
.tarot-back{background:linear-gradient(135deg,var(--tarot-accent),var(--tarot-gold));border:2px solid var(--tarot-gold);}
.tarot-back::before{content:"";position:absolute;inset:6px;border:1px solid rgba(255,255,255,.4);border-radius:7px;}
.tarot-front{background:var(--tarot-card);border:2px solid var(--tarot-gold);transform:rotateY(180deg);flex-direction:column;padding:7px;text-align:center;}
.tarot-front svg{width:62px;height:62px;}
.tarot-front .tn{font-size:11px;font-weight:800;color:var(--tarot-text);margin-top:5px;}
.tarot-front .tr{font-size:10px;color:var(--tarot-accent);font-weight:600;}
.tarot-results{margin-top:22px;}
.tarot-result-item{background:var(--tarot-card);border-radius:15px;padding:15px;margin-bottom:13px;border:1px solid color-mix(in srgb,var(--tarot-gold) 45%,transparent);box-shadow:0 2px 10px rgba(0,0,0,.05);}
.tarot-result-item .rt{font-weight:800;color:var(--tarot-accent);font-size:15px;}
.tarot-result-item .rp{font-size:11.5px;color:var(--tarot-gold);margin-bottom:7px;font-weight:700;letter-spacing:1px;}
.tarot-result-item .rd{font-size:13px;line-height:1.65;color:var(--tarot-text);}

/* 通话层 */
#callLayer{position:fixed;inset:0;z-index:210;background:linear-gradient(165deg,#2a2a38,#181820);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;animation:fadeIn .25s ease;}
#callLayer .call-avatar{width:118px;height:118px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.25);margin-bottom:20px;display:flex;align-items:center;justify-content:center;background:#3a3a48;box-shadow:0 0 40px rgba(255,255,255,.08);}
#callLayer .call-avatar img{width:100%;height:100%;object-fit:cover;}
#callLayer .call-name{font-size:21px;font-weight:700;margin-bottom:10px;letter-spacing:.5px;}
#callLayer .call-status{font-size:14px;opacity:.6;margin-bottom:34px;letter-spacing:1px;}
.call-btns{display:flex;gap:26px;}
.call-btn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3);}
.call-btn.hang{background:linear-gradient(145deg,#e85d5d,#c43a3a);}
.call-btn.mute{background:rgba(255,255,255,.16);}
.call-btn.mini{background:rgba(255,255,255,.16);}
#callMini{position:fixed;z-index:211;width:66px;height:66px;border-radius:50%;background:linear-gradient(145deg,#3a3a4a,#2a2a35);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,.4);touch-action:none;border:2px solid rgba(255,255,255,.1);}
#callMini .cm-timer{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--text);background:var(--panel);padding:2px 8px;border-radius:9px;font-size:10px;font-weight:600;box-shadow:var(--shadow-sm);}

/* 信件 */
#letterDetail .letter-paper{background:var(--panel);border-radius:12px;padding:20px 18px 20px 32px;position:relative;margin-bottom:15px;box-shadow:var(--shadow-sm);border:1px solid color-mix(in srgb,var(--divider) 60%,transparent);}
#letterDetail .letter-paper::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--accent) 55%,transparent);}
.letter-lines{background-image:repeating-linear-gradient(transparent,transparent 28px,color-mix(in srgb,var(--divider) 70%,transparent) 28px,color-mix(in srgb,var(--divider) 70%,transparent) 29px);line-height:29px;font-size:14px;white-space:pre-wrap;word-break:break-word;min-height:60px;}
.letter-stamp{position:absolute;top:11px;right:13px;width:46px;height:54px;border:1.5px dashed var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:9px;font-weight:700;transform:rotate(7deg);opacity:.75;line-height:1.2;text-align:center;}
.letter-head{font-size:12px;color:var(--text-sub);margin-bottom:11px;font-weight:600;}
.letter-status-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:10px;background:var(--input-bg);color:var(--text-sub);margin-top:9px;font-weight:600;}
.letter-item{background:var(--panel);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .14s ease;}
.letter-item:active{transform:scale(.99);}
.letter-item .li-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.letter-item .li-title{font-weight:700;font-size:14px;}
.letter-item .li-preview{font-size:12.5px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.letter-unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
#letterToast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:300;background:linear-gradient(145deg,var(--btn),color-mix(in srgb,var(--btn) 82%,#000));color:var(--btn-text);padding:12px 20px;border-radius:15px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideDown .32s cubic-bezier(.4,1.3,.6,1);cursor:pointer;white-space:nowrap;}
@keyframes slideDown{from{transform:translate(-50%,-24px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}

/* 长按菜单 */
#ctxMenu{position:fixed;z-index:250;background:var(--panel);border-radius:13px;box-shadow:var(--shadow-lg);overflow:hidden;min-width:132px;animation:pop .14s ease;border:1px solid var(--divider);}
#ctxMenu button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 17px;font-size:14px;text-align:left;color:var(--text);font-weight:500;}
#ctxMenu button:active{background:var(--input-bg);}

/* 响应式 */
@media(max-width:520px){
  .top-avatar{width:42px;height:42px;}
  .top-heart{width:48px;}
  .func-btn{width:23px;height:23px;}
  .func-btn svg{width:13px;height:13px;}
  .func-strip{gap:4px;}
  .top-name{max-width:52px;}
  .fab{width:50px;height:50px;}
  .fab.fab-plain{width:43px;height:43px;}
}
</style>

let dbPromise=null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    const req = indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded = e=>{ const db=e.target.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = e=>res(e.target.result);
    req.onerror = e=>rej(e.target.error);
  });
  return dbPromise;
}
async function idbPut(key,dataURL){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(dataURL,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const r=tx.objectStore(IDB_STORE).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }
async function idbDel(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

const fmtTime = ts=>{ const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };
const fmtDate = ts=>{ const d=new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };
const dayKey = ts=>{ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const rand = (a,b)=>a+Math.random()*(b-a);
const randInt = (a,b)=>Math.floor(rand(a,b+1));

function loadJSON(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function saveJSON(k,v){ localStorage.setItem(k,JSON.stringify(v)); }
function toast(msg){ const root=document.getElementById('toastRoot'); const el=document.createElement('div'); el.textContent=msg; el.style.cssText='position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(30,25,22,.82);color:#fff;padding:10px 20px;border-radius:13px;font-size:13.5px;font-weight:500;z-index:400;box-shadow:0 6px 24px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:pop .2s ease;'; root.appendChild(el); setTimeout(()=>el.remove(),2000); }
function readFileAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

}

function applyTheme(settings){
  const root=document.documentElement;
  const theme = THEMES.find(t=>t.id===settings.themeId)||THEMES[0];
  const vars = settings.customColors ? Object.assign({},theme.vars,settings.customColors) : theme.vars;
  Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  document.body.className = 'shape-'+(settings.shape||'tail');
  const isDark = isDarkColor(vars['--bg']);
  root.style.setProperty('--user-text', isDark?'#f0f0f0':'#2f3a2a');
  if(settings.customColors){ root.style.setProperty('--dream-text', isDark?'#f0f0f0':'#333'); }
}
function isDarkColor(hex){
  if(!hex) return false;
  if(hex.startsWith('rgba')||hex.startsWith('rgb')) return false;
  const c=hex.replace('#',''); if(c.length<6) return false;
  const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 < 128;
}
function applyChatBackground(settings){
  const list=document.getElementById('msgList');
  if(settings.bgImage){ list.style.backgroundImage=`url(${settings.bgImage})`; }
  else { list.style.backgroundImage='none'; }
}

function renderAvatar(src,elId){

function renderMessages(){
  const list=document.getElementById('msgList');
  const data=state.data; const dream=getDream(state.currentDreamId);
  if(!data||!dream){ list.innerHTML=''; return; }
  let html=''; let lastDay=null;
  for(const m of data.messages){
    const dk=dayKey(m.ts);
    if(dk!==lastDay){ lastDay=dk; html+=`<div class="day-divider"><span>${fmtDate(m.ts)} ${fmtTime(m.ts)}</span></div>`; }
    if(m.type==='system'){ html+=`<div class="sys-msg"><span>${esc(m.text)}</span></div>`; continue; }
    if(m.type==='call'){ html+=`<div class="sys-msg"><span>${esc(m.text)}</span></div>`; continue; }
    const isUser=m.role==='user';
    const avatarSrc = isUser ? state.profile.avatar : dream.avatarKey;
    const name = isUser ? (state.profile.name||'我') : dream.name;
    let inner='';
    if(m.quote){ inner+=`<div class="quote-block">${esc(m.quote.name)}：${esc(m.quote.text.slice(0,40))}</div>`; }
    if(m.type==='text'){ inner+=`<div class="bubble">${esc(m.text)}${data.settings.starDeco&&!isUser?'<svg class="star-deco" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.2 7.1L12 17.8 5.8 21.2 7 14.1 2 9.3l7.1-.7z"/></svg>':''}</div>`; }
    else if(m.type==='image'){ inner+=`<img class="msg-img" src="${m.src}">`; }
    else if(m.type==='sticker'){ inner+=`<img class="msg-sticker" src="${m.src}">`; }
    else if(m.type==='survey'){ inner+=renderSurveyCard(m,isUser); }
    const status = (data.settings.readReceipt&&isUser&&m.read!==undefined) ? `<div class="msg-status">${m.read?'已讀':'未讀'}</div>`:'';
    html+=`<div class="msg-row ${isUser?'user':'dream'}" data-mid="${m.id}">
      <div class="msg-avatar">${avatarSrc?`<img src="${avatarSrc}">`:'<span class="ph">?</span>'}</div>
      <div class="msg-body">
        <div class="msg-meta"><span>${esc(name)}</span><span>${fmtTime(m.ts)}</span></div>
        ${inner}${status}
      </div>
    </div>`;
  }
  list.innerHTML=html;
  bindMsgLongPress();
  list.scrollTop=list.scrollHeight;
}
function renderSurveyCard(m,isUser){
  const picked = m.answerIndex;
  return `<div class="survey-card">
    <div class="survey-title">${esc(m.question)}</div>
    ${m.options.map((o,i)=>`<div class="survey-opt ${picked===i?'picked':''}">${i+1}. ${esc(o)}</div>`).join('')}
    ${picked!==undefined?`<div class="survey-result">✓ ${esc(isUser?'你':getDream(state.currentDreamId).name)}選擇了：${esc(m.options[picked])}</div>`:''}
  </div>`;
}
function bindMsgLongPress(){
  document.querySelectorAll('.msg-row').forEach(row=>{
    const mid=row.dataset.mid;
    let timer=null;
    const start=()=>{ timer=setTimeout(()=>{ timer=null; msgCtx(row,mid); },500); };
    const cancel=()=>{ if(timer){clearTimeout(timer);timer=null;} };
    row.addEventListener('touchstart',start,{passive:true});
    row.addEventListener('touchend',cancel);
    row.addEventListener('touchmove',cancel);
    row.addEventListener('contextmenu',e=>{ e.preventDefault(); msgCtx(row,mid); });
  });
}
function msgCtx(row,mid){

function sendText(){

function pickChatImage(){
  const f=document.getElementById('hiddenFile');
  f.accept='image/*'; f.value='';
  f.onchange=async()=>{
    const file=f.files[0]; if(!file) return;
    const dataURL=await readFileAsDataURL(file);
    const key=`img_${uid()}`;
    await idbPut(idbKey(state.currentDreamId,key),dataURL);
    pushMessage({role:'user',type:'image',src:dataURL,imageKey:key});

  };

function pushMessage(msg){
  const m={id:uid(),ts:now(),read:false,...msg};
  state.data.messages.push(m);
  saveData(state.currentDreamId,state.data);
  renderMessages();
  return m;
}
function scheduleDreamReply(){
  const data=state.data;
  if(!data) return;
  const delay=data.settings.replyDelay*1000;
  if(typingTimer) clearTimeout(typingTimer);
  if(data.settings.typingEnabled) showTyping();
  typingTimer=setTimeout(()=>{
    hideTyping();
    dreamReply();
  },delay);
}
function showTyping(){
  const list=document.getElementById('msgList');
  const dream=getDream(state.currentDreamId);
  const data=state.data;
  const old=document.getElementById('typingRow'); if(old) old.remove();

  el.innerHTML=`${data.settings.typingAvatar&&dream.avatarKey?`<div class="msg-avatar"><img src="${dream.avatarKey}"></div>`:(data.settings.typingAvatar?'<div class="msg-avatar"><span class="ph">?</span></div>':'')}

  el.onclick=()=>{ const t=prompt('自訂打字提示文字',data.settings.typingText); if(t){ data.settings.typingText=t; saveData(state.currentDreamId,data); const box=el.querySelector('.typing-box'); box.firstChild.textContent=t; } };
  list.appendChild(el);
  list.scrollTop=list.scrollHeight;
}
function hideTyping(){ const el=document.getElementById('typingRow'); if(el) el.remove(); }
function dreamReply(){
  const data=state.data; if(!data||!data.cards.length) return;
  const dream=getDream(state.currentDreamId);
  const lastUser=[...data.messages].reverse().find(m=>m.role==='user'&&m.type==='text');
  let quote=null;
  if(data.settings.quoteEnabled && lastUser && Math.random()<0.4){
    quote={name:state.profile.name||'我',text:lastUser.text};
  }
  const text=pick(data.cards);
  pushMessage({role:'dream',type:'text',text,quote});
  if(data.settings.readReceipt){ data.messages.forEach(m=>{ if(m.role==='user') m.read=true; }); saveData(state.currentDreamId,data); }
}
function nudgeDream(){
  if(!state.data) return;
  showTyping();
  setTimeout(()=>{ hideTyping(); dreamReply(); },1200);

function quoteMsg(mid){
  const m=state.data.messages.find(x=>x.id===mid); if(!m) return;
  const name=m.role==='user'?(state.profile.name||'我'):getDream(state.currentDreamId).name;
  pendingQuote={name,text:m.text||'[媒體]'};

}

function copyMsg(mid){

function startTimers(){
  stopTimers();
  const data=state.data; if(!data) return;
  if(data.settings.activeMessage){
    const tick=()=>{
      const d=getData(state.currentDreamId);
      if(!d.settings.activeMessage) return;
      const wait=randInt(d.settings.activeMsgMin,d.settings.activeMsgMax)*1000;
      activeMsgTimer=setTimeout(()=>{ if(document.getElementById('pageChat').classList.contains('active')){ dreamReply(); } tick(); },wait);
    };
    tick();
  }
  if(data.settings.activeCall){
    callCheckTimer=setInterval(()=>{
      if(!document.getElementById('pageChat').classList.contains('active')) return;
      if(Math.random()<0.10) incomingCall();
    },60000);
  }
  startLetterCheck();
}
function stopTimers(){
  if(typingTimer) clearTimeout(typingTimer);
  if(activeMsgTimer) clearTimeout(activeMsgTimer);
  if(callCheckTimer) clearInterval(callCheckTimer);
  typingTimer=activeMsgTimer=callCheckTimer=null;
}

let callState=null;
function startCall(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  const accepted=Math.random()<0.5;
  const overlay=document.createElement('div');
  overlay.id='callLayer';
  overlay.innerHTML=`<div class="call-avatar">${dream.avatarKey?`<img src="${dream.avatarKey}">`:'<span style="font-size:36px;color:#fff;">?</span>'}</div>
    <div class="call-name">${esc(dream.name)}</div>
    <div class="call-status" id="callStatus">正在撥號...</div>
    <div class="call-btns"><button class="call-btn hang" onclick="endCall(true)">掛斷</button></div>`;
  document.getElementById('callRoot').appendChild(overlay);
  callState={start:now(),dreamId:dream.id,accepted:false};
  setTimeout(()=>{
    if(!callState) return;
    if(accepted){
      callState.accepted=true;
      const st=document.getElementById('callStatus');
      if(st) st.textContent='00:00';
      const timer=setInterval(()=>{ if(!callState) return; const sec=Math.floor((now()-callState.start)/1000); const st2=document.getElementById('callStatus'); if(st2) st2.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
      callState.timer=timer;
    } else {
      endCall(true,'對方已拒絕');
    }
  },2500);
}
function incomingCall(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  if(callState) return;
  const overlay=document.createElement('div');
  overlay.id='callLayer';
  overlay.innerHTML=`<div class="call-avatar">${dream.avatarKey?`<img src="${dream.avatarKey}">`:'<span style="font-size:36px;color:#fff;">?</span>'}</div>
    <div class="call-name">${esc(dream.name)}</div>
    <div class="call-status">來電中...</div>
    <div class="call-btns">
      <button class="call-btn hang" onclick="endCall(true,'未接來電')">拒絕</button>
      <button class="call-btn mute" onclick="acceptIncoming()">接聽</button>
    </div>`;
  document.getElementById('callRoot').appendChild(overlay);
  callState={incoming:true,dreamId:dream.id};
  callState.timeout=setTimeout(()=>{ if(callState&&callState.incoming){ endCall(true,'未接來電'); } },15000);
}
function acceptIncoming(){
  if(!callState) return;
  clearTimeout(callState.timeout);
  callState={start:now(),dreamId:state.currentDreamId,accepted:true};
  const st=document.getElementById('callStatus'); if(st) st.textContent='00:00';
  const overlay=document.getElementById('callLayer');
  const btns=overlay.querySelector('.call-btns');
  btns.innerHTML=`<button class="call-btn mute" onclick="this.style.opacity=.4">靜音</button><button class="call-btn mini" onclick="minimizeCall()">最小化</button><button class="call-btn hang" onclick="endCall(true)">掛斷</button>`;
  const timer=setInterval(()=>{ if(!callState||!callState.accepted) return; const sec=Math.floor((now()-callState.start)/1000); const st2=document.getElementById('callStatus'); if(st2) st2.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
  callState.timer=timer;
}
function minimizeCall(){
  if(!callState) return;
  const overlay=document.getElementById('callLayer'); if(overlay) overlay.remove();
  const mini=document.createElement('div');
  mini.id='callMini';
  mini.innerHTML=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-3 2a13 13 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span class="cm-timer" id="cmTimer">00:00</span>`;
  mini.style.left=(window.innerWidth-90)+'px'; mini.style.top=(window.innerHeight-160)+'px';
  document.body.appendChild(mini);
  let sx=0,sy=0,ox=0,oy=0,dragging=false;
  mini.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; ox=mini.offsetLeft; oy=mini.offsetTop; dragging=true; },{passive:true});
  mini.addEventListener('touchmove',e=>{ if(!dragging) return; e.preventDefault(); const t=e.touches[0]; let nx=ox+t.clientX-sx, ny=oy+t.clientY-sy; nx=Math.max(4,Math.min(window.innerWidth-68,nx)); ny=Math.max(4,Math.min(window.innerHeight-68,ny)); mini.style.left=nx+'px'; mini.style.top=ny+'px'; },{passive:false});
  mini.addEventListener('touchend',()=>{ dragging=false; });
  mini.addEventListener('click',()=>{ if(callState){ mini.remove(); const ov=document.createElement('div'); ov.id='callLayer'; const dream=getDream(state.currentDreamId); ov.innerHTML=`<div class="call-avatar">${dream?.avatarKey?`<img src="${dream.avatarKey}">`:'<span style="font-size:36px;color:#fff;">?</span>'}</div><div class="call-name">${esc(dream?.name||'')}</div><div class="call-status" id="callStatus">00:00</div><div class="call-btns"><button class="call-btn mute" onclick="this.style.opacity=.4">靜音</button><button class="call-btn mini" onclick="minimizeCall()">最小化</button><button class="call-btn hang" onclick="endCall(true)">掛斷</button></div>`; document.getElementById('callRoot').appendChild(ov); } });
  if(callState.timer) clearInterval(callState.timer);
  callState.timer=setInterval(()=>{ if(!callState) return; const sec=Math.floor((now()-callState.start)/1000); const el=document.getElementById('cmTimer'); if(el) el.textContent=`${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; },1000);
}
function endCall(record,reason){
  const el=document.getElementById('callLayer'); if(el) el.remove();
  const mini=document.getElementById('callMini'); if(mini) mini.remove();
  if(callState?.timer) clearInterval(callState.timer);
  if(callState?.timeout) clearTimeout(callState.timeout);
  const sec=callState?Math.floor((now()-(callState.start||now()))/1000):0;
  const dreamId=callState?.dreamId||state.currentDreamId;
  callState=null;
  if(record&&dreamId){
    const data=getData(dreamId);
    let text;
    if(reason==='對方已拒絕') text='通話結束 · 對方已拒絕';
    else if(reason==='未接來電') text='通話結束 · 未接來電';
    else text=`通話結束 · ${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
    data.messages.push({id:uid(),ts:now(),role:'system',type:'call',text});
    saveData(dreamId,data);
    if(dreamId===state.currentDreamId&&state.data) state.data=data;
    if(document.getElementById('pageChat').classList.contains('active')) renderMessages();
  }
}

function openSurveyBuilder(){

window.sqRemove=function(i){ const vals=[...document.querySelectorAll('#sqOpts input')].map(x=>x.value); if(vals.length<=2){toast('至少 2 個選項');return;} vals.splice(i,1); openSurveyBuilderWith(vals); };

function submitSurvey(){
  const title=document.getElementById('sqTitle')?.value.trim();
  const opts2=[...document.querySelectorAll('#sqOpts input')].map(i=>i.value.trim()).filter(Boolean);
  if(!title){ toast('請輸入題目'); return; }

  closeModal();
  const m=pushMessage({role:'user',type:'survey',question:title,options:opts2});

  const delay=data.settings.replyDelay*1000;

      <button class="lib-btn" onclick="backup('cards')">僅字卡庫</button>
    </div>
    <div class="modal-label">匯入</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="lib-btn" onclick="importBackup('all')">全部</button>
      <button class="lib-btn" onclick="importBackup('chat')">僅聊天</button>
      <button class="lib-btn" onclick="importBackup('cards')">僅字卡庫</button>
    </div>
    <div class="modal-label">清除</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="lib-btn" onclick="clearChat()">聊天記錄</button>
      <button class="lib-btn" onclick="clearCards()">字卡庫</button>
    </div>
    <div class="modal-actions"><button onclick="closeModal()">關閉</button></div>`);
}
function backup(kind){
  const data=state.data; const dream=getDream(state.currentDreamId);
  let obj;
  if(kind==='all') obj={dream,data};
  else if(kind==='chat') obj={messages:data.messages};
  else obj={cards:data.cards,kaomoji:data.kaomoji,stickers:data.stickers};
  downloadText(JSON.stringify(obj,null,2),`備份_${dream?.name||'夢角'}_${kind}.json`);
}
function importBackup(kind){
  const f=document.getElementById('hiddenFile'); f.accept='.json'; f.value='';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return; const text=await file.text(); try{ const obj=JSON.parse(text); if(kind==='all'&&obj.data){ state.data=Object.assign(getData(state.currentDreamId),obj.data); } else if(kind==='chat'&&obj.messages){ state.data.messages=obj.messages; } else if(kind==='cards'){ if(obj.cards) state.data.cards=obj.cards; if(obj.kaomoji) state.data.kaomoji=obj.kaomoji; if(obj.stickers) state.data.stickers=obj.stickers; } saveData(state.currentDreamId,state.data); renderLib(); toast('匯入完成'); }catch(e){ toast('格式錯誤'); } };
  f.click();
}
function clearChat(){ if(!confirm('確定清除聊天記錄？')) return; state.data.messages=[]; saveData(state.currentDreamId,state.data); renderMessages(); toast('已清除'); }
function clearCards(){ if(!confirm('確定清除字卡庫？')) return; state.data.cards=[]; state.data.kaomoji=[]; state.data.stickers=[]; saveData(state.currentDreamId,state.data); renderLib(); toast('已清除'); }

function pickAvatar(target,dreamId){
  const f=document.getElementById('hiddenFile'); f.accept='image/*'; f.value='';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return; const url=await readFileAsDataURL(file); if(target==='dream'){ const d=getDream(dreamId); d.avatarKey=url; saveDreams(); renderHome(); if(state.currentDreamId===dreamId) renderAvatar(url,'topDreamAvatar'); } else if(target==='profile'){ state.profile.avatar=url; saveProfile(); renderAvatar(url,'topUserAvatar'); idbPut(PROFILE_AVATAR_KEY,url); } else if(target==='bg'){ state.data.settings.bgImage=url; saveData(state.currentDreamId,state.data); applyChatBackground(state.data.settings); } openEditDream(); };
  f.click();
}

function openModal(html){ const root=document.getElementById('modalRoot'); root.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openProfile(){
  openModal(`<h3>個人資料</h3>
    <div class="profile-avatar-edit" onclick="pickAvatar('profile','')">${state.profile.avatar?`<img src="${state.profile.avatar}">`:'<span class="ph">👤</span>'}</div>
    <div class="avatar-hint">點擊更換頭像</div>
    <div class="modal-label">名字（全域使用）</div>
    <input class="modal-input" id="profileName" maxlength="20" value="${esc(state.profile.name||'')}" placeholder="你的名字">
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveProfileName()">儲存</button></div>`);
}
function saveProfileName(){
  const name=document.getElementById('profileName').value.trim()||'訪客';
  state.profile.name=name; saveProfile();
  document.getElementById('navAccountName').textContent=name;
  document.getElementById('topUserName').textContent=name;
  closeModal(); toast('已儲存');
}

function openAddDream(){
  openModal(`<h3>新增夢角</h3>
    <div class="profile-avatar-edit" onclick="pickAddDreamAvatar()" id="addDreamAvatarBox"><span class="ph">?</span></div>
    <div class="avatar-hint">點擊上傳頭像（可選）</div>
    <div class="modal-label">名字</div>
    <input class="modal-input" id="newDreamName" maxlength="20" placeholder="夢角名字">
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="createDream()">建立並聊天</button></div>`);
  window.__newDreamAvatar=null;
}
function pickAddDreamAvatar(){
  const f=document.getElementById('hiddenFile'); f.accept='image/*'; f.value='';
  f.onchange=async()=>{ const file=f.files[0]; if(!file) return; const url=await readFileAsDataURL(file); window.__newDreamAvatar=url; const box=document.getElementById('addDreamAvatarBox'); box.innerHTML=`<img src="${url}">`; };
  f.click();
}
function createDream(){
  const name=document.getElementById('newDreamName').value.trim();
  if(!name){ toast('請輸入名字'); return; }
  const d={id:uid(),name,avatarKey:window.__newDreamAvatar||null};
  state.dreams.push(d); saveDreams();
  ensureData(d.id);
  closeModal(); renderHome(); openChat(d.id);
}
function openEditDream(){
  const dream=getDream(state.currentDreamId); if(!dream) return;
  openModal(`<h3>編輯夢角</h3>
    <div class="profile-avatar-edit" onclick="pickAvatar('dream','${dream.id}')">${dream.avatarKey?`<img src="${dream.avatarKey}">`:'<span class="ph">?</span>'}</div>
    <div class="avatar-hint">點擊更換頭像</div>
    <div class="modal-label">名字</div>
    <input class="modal-input" id="editDreamName" maxlength="20" value="${esc(dream.name)}">
    <div class="modal-label">背景圖</div>
    <button class="lib-btn" onclick="pickAvatar('bg','${dream.id}')">導入背景圖</button>
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveEditDream()">儲存</button></div>`);
}
function saveEditDream(){
  const dream=getDream(state.currentDreamId);
  dream.name=document.getElementById('editDreamName').value.trim()||dream.name;
  saveDreams(); closeModal(); renderHome();
  document.getElementById('navTitle').textContent=`與 ${dream.name} 聊天`;
  document.getElementById('topDreamName').textContent=dream.name;
  renderMessages();
}
function confirmDeleteDream(id){
  if(!confirm('刪除該夢角？其聊天、字卡、信件都會一併刪除。')) return;
  state.dreams=state.dreams.filter(d=>d.id!==id); saveDreams();
  localStorage.removeItem(dataKey(id));
  state.letters=state.letters.filter(l=>l.dreamId!==id); saveLetters();
  closeCtxMenu(); goBack(); renderHome();
}

function showCtxMenu(x,y,items){
  closeCtxMenu();
  const menu=document.createElement('div'); menu.id='ctxMenu';
  menu.innerHTML=items.map((it,i)=>`<button data-i="${i}">${it.label}</button>`).join('');
  menu.style.left=Math.min(x,window.innerWidth-150)+'px'; menu.style.top=Math.min(y,window.innerHeight-160)+'px';
  document.body.appendChild(menu);
  menu.querySelectorAll('button').forEach((b,i)=>{ b.onclick=()=>{ const fn=items[i].fn; closeCtxMenu(); fn(); }; });
}
function closeCtxMenu(){ const m=document.getElementById('ctxMenu'); if(m) m.remove(); }
document.addEventListener('click',e=>{ if(!e.target.closest('#ctxMenu')) closeCtxMenu(); });

function goBack(){
  document.getElementById('pageChat').classList.remove('active');
  document.getElementById('pageLib').classList.remove('active');
  document.getElementById('pageHome').classList.add('active');
  stopTimers();
  renderHome();
  document.getElementById('navBack').classList.add('hidden');
}

function openStickerPicker(){
  const data=state.data;
  if(!data.stickers.length){ toast('表情包庫為空'); return; }
  openModal(`<h3>選擇表情包</h3><div class="sticker-grid">${data.stickers.map((s,i)=>`<img src="${s}" onclick="sendSticker(${i})">`).join('')}</div>
    <div class="modal-actions"><button onclick="closeModal()">取消</button></div>`);
}
function sendSticker(i){ const s=state.data.stickers[i]; closeModal(); pushMessage({role:'user',type:'sticker',src:s}); scheduleDreamReply(); }

const TAROT = [
  {n:'愚者',u:'新的開始、冒險、純真、無限可能。',r:'衝動、魯莽、逃避責任、缺乏方向。'},
  {n:'魔術師',u:'創造力、行動力、資源充足、掌握局面。',r:'欺騙、能力不足、計畫落空。'},
  {n:'女祭司',u:'直覺、內在智慧、神秘、耐心等待。',r:'忽視直覺、隱瞞、情緒壓抑。'},
  {n:'皇后',u:'豐盛、母性、滋養、感官享受。',r:'過度依賴、停滯、缺乏照顧。'},
  {n:'皇帝',u:'權威、秩序、穩定、父性保護。',r:'專制、固執、失控。'},
  {n:'教皇',u:'傳統、信仰、指引、精神導師。',r:'教條、叛逆、錯誤指引。'},
  {n:'戀人',u:'愛、結合、選擇、和諧。',r:'分離、誘惑、錯誤選擇。'},
  {n:'戰車',u:'意志力、勝利、前進、掌控。',r:'失控、方向錯誤、挫敗。'},
  {n:'力量',u:'勇氣、溫柔的堅持、內在力量。',r:'懦弱、自我懷疑、濫用力量。'},
  {n:'隱者',u:'獨處、內省、尋求真理、指引。',r:'孤立、逃避、迷失。'},
  {n:'命運之輪',u:'轉機、循環、命運、好運。',r:'厄運、停滯、抗拒改變。'},
  {n:'正義',u:'公平、真相、因果、平衡。',r:'不公、欺瞞、失衡。'},
  {n:'吊人',u:'犧牲、等待、換位思考、頓悟。',r:'無謂犧牲、拖延、固執。'},
  {n:'死神',u:'結束、轉化、重生、放下。',r:'抗拒改變、停滯、恐懼。'},
  {n:'節制',u:'平衡、調和、耐心、中庸。',r:'失衡、極端、缺乏耐心。'},
  {n:'惡魔',u:'慾望、束縛、誘惑、物質。',r:'解脫、覺醒、切斷束縛。'},
  {n:'高塔',u:'突變、崩解、覺醒、破壞重建。',r:'逃避災難、延遲改變、恐懼。'},
  {n:'星星',u:'希望、療癒、靈感、信心。',r:'失望、缺乏信心、迷惘。'},
  {n:'月亮',u:'潛意識、不安、幻象、直覺。',r:'釋懷、真相浮現、走出迷霧。'},
  {n:'太陽',u:'成功、喜悅、活力、光明。',r:'短暫陰霾、過度樂觀、延遲成功。'},
  {n:'審判',u:'覺醒、召喚、重生、寬恕。',r:'自我懷疑、逃避審視、悔恨。'},
  {n:'世界',u:'完成、圓滿、整合、旅程終點。',r:'未完成、停滯、缺乏收尾。'},
];
let tarotState={count:1,question:'',cards:[]};
function openTarot(){
  document.getElementById('tarotRoot').innerHTML=`<div id="tarotLayer">
    <button class="tarot-close" onclick="closeTarot()">✕</button>
    <div class="tarot-title">塔羅占卜</div>
    <div class="tarot-sub">選擇牌陣並提出你的問題</div>
    <div class="tarot-opts">
      <button class="tarot-opt active" id="topt1" onclick="setTarotCount(1)">單牌</button>
      <button class="tarot-opt" id="topt3" onclick="setTarotCount(3)">過去·現在·未來</button>
    </div>
    <input class="tarot-input" id="tarotQ" placeholder="你的問題（可選）">
    <button class="tarot-btn" onclick="drawTarot()">洗牌抽牌</button>
    <div class="tarot-cards" id="tarotCards"></div>
    <div class="tarot-results" id="tarotResults"></div>
  </div>`;
}
function closeTarot(){ document.getElementById('tarotRoot').innerHTML=''; }
function setTarotCount(n){ tarotState.count=n; document.getElementById('topt1').classList.toggle('active',n===1); document.getElementById('topt3').classList.toggle('active',n===3); }
function drawTarot(){
  tarotState.question=document.getElementById('tarotQ').value.trim();
  const pool=[...TAROT].sort(()=>Math.random()-0.5).slice(0,tarotState.count);
  tarotState.cards=pool.map(t=>({...t,rev:Math.random()<0.5}));
  const wrap=document.getElementById('tarotCards');
  wrap.innerHTML=tarotState.cards.map((c,i)=>`<div class="tarot-card-wrap" id="tc${i}" onclick="flipTarot(${i})"><div class="tarot-card-inner">
    <div class="tarot-face tarot-back"><svg width="30" height="30" viewBox="0 0 24 24" fill="var(--tarot-gold)"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.2 7.1L12 17.8 5.8 21.2 7 14.1 2 9.3l7.1-.7z"/></svg></div>
    <div class="tarot-face tarot-front">${tarotCardSVG(i)}<div class="tn">${c.n}</div><div class="tr">${c.rev?'逆位':'正位'}</div></div>
  </div></div>`).join('');
  setTimeout(()=>tarotState.cards.forEach((_,i)=>flipTarot(i)),600);
}
function tarotCardSVG(i){
  const colors=['#c9a35c','#c98b8b','#7a9a5e','#7a9ab0','#9a7ac8','#d9954a'];
  const c=colors[i%colors.length];
  return `<svg viewBox="0 0 60 60" fill="none" stroke="${c}" stroke-width="2"><circle cx="30" cy="30" r="20"/><path d="M30 12v36M12 30h36"/><circle cx="30" cy="30" r="8" fill="${c}" fill-opacity=".2"/></svg>`;
}
function flipTarot(i){
  const el=document.getElementById('tc'+i); if(!el) return;
  el.classList.add('flipped');
  setTimeout(()=>renderTarotResults(),400);
}
function renderTarotResults(){
  const positions = tarotState.count===1?['現在']:['過去','現在','未來'];
  document.getElementById('tarotResults').innerHTML=tarotState.cards.map((c,i)=>`<div class="tarot-result-item">
    <div class="rt">${c.n} ${c.rev?'（逆位）':'（正位）'}</div>
    <div class="rp">${positions[i]}</div>
    <div class="rd">${c.rev?c.r:c.u}</div>
  </div>`).join('');
}

function startLetterCheck(){
  if(letterCheckTimer) clearInterval(letterCheckTimer);
  letterCheckTimer=setInterval(()=>{ checkLetters(false); },60000);
  checkLetters(false);
}
function checkLettersOnHome(){ checkLetters(true); }
function checkLetters(showToast){
  loadLetters();
  let changed=false;
  const t=now();
  state.letters.forEach(l=>{
    if(!l.gotReply&&l.replyAt&&t>=l.replyAt){
      const data=getData(l.dreamId);
      const n=data.settings.letterSentences||30;
      const cards=data.cards.length?data.cards:DEFAULT_CARDS;
      const lines=[]; for(let i=0;i<n;i++) lines.push(pick(cards));
      l.replyBody=lines.join('\n');
      l.gotReply=true; l.repliedAt=t; changed=true;
    }
  });
  if(changed) saveLetters();
  updateInboxBadge();
  if(showToast){
    const unread=state.letters.filter(l=>l.gotReply&&!l.read);
    if(unread.length){ showLetterToast(unread[0]); }
  }
}
function showLetterToast(letter){
  const old=document.getElementById('letterToast'); if(old) old.remove();
  const dream=getDream(letter.dreamId);
  const el=document.createElement('div'); el.id='letterToast';
  el.textContent=`${dream?dream.name:'夢角'} 回信了！點擊查看`;
  el.onclick=()=>{ el.remove(); openLetterDetail(letter.id); };
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),8000);
}
function openWriteLetter(){
  loadDreams();
  if(!state.dreams.length){ toast('請先建立夢角'); return; }
  openModal(`<h3>寫信</h3>
    <div class="modal-label">收信夢角</div>
    <select class="modal-input" id="letterTo">${state.dreams.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select>
    <div class="modal-label">信件內容（最多 800 字）</div>
    <textarea class="modal-input" id="letterBody" rows="6" maxlength="800" placeholder="寫下想說的話..." oninput="document.getElementById('letterCount').textContent=this.value.length+'/800'"></textarea>
    <div style="text-align:right;font-size:12px;color:var(--text-sub);" id="letterCount">0/800</div>
    <div class="modal-actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="sendLetter()">寄出</button></div>`);
}
function sendLetter(){
  const dreamId=document.getElementById('letterTo').value;
  const body=document.getElementById('letterBody').value.trim();
  if(!body){ toast('請輸入內容'); return; }
  const dream=getDream(dreamId);
  const t=now();
  const letter={id:uid(),dreamId,fromName:state.profile.name||'訪客',toName:dream.name,body,sentAt:t,replyAt:t+randInt(8,12)*3600*1000,replyBody:'',gotReply:false,read:false,repliedAt:null};
  state.letters.push(letter); saveLetters();
  closeModal(); updateInboxBadge();
  toast('已寄出，靜候回信');
  startLetterCheck();
}
function openInbox(){
  loadLetters();
  const items=[...state.letters].sort((a,b)=>b.sentAt-a.sentAt);
  openModal(`<h3>收件匣</h3>
    ${items.length?items.map(l=>{
      const dream=getDream(l.dreamId);
      const status = !l.gotReply?'等待回信中':(l.read?'已讀':'新回信');
      return `<div class="letter-item" onclick="openLetterDetail('${l.id}')">
        <div class="li-top"><span class="li-title">${esc(dream?dream.name:'未知')}</span>${l.gotReply&&!l.read?'<span class="letter-unread-dot"></span>':''}</div>
        <div class="li-preview">${status} · ${esc(l.body.slice(0,30))}</div>
      </div>`;
    }).join(''):'<div class="lib-empty">還沒有信件</div>'}
    <div class="modal-actions"><button onclick="closeModal()">關閉</button></div>`);
}
function openLetterDetail(id){
  loadLetters();
  const l=state.letters.find(x=>x.id===id); if(!l) return;
  if(l.gotReply&&!l.read){ l.read=true; saveLetters(); updateInboxBadge(); }
  const status = !l.gotReply?`等待回信中（預計 ${new Date(l.replyAt).toLocaleString()}）`: (l.read?'已讀':'新回信');
  openModal(`<h3>信件詳情</h3>
    <div class="letter-paper">
      <div class="letter-stamp">夢<br>郵</div>
      <div class="letter-head">${esc(l.fromName)} → ${esc(l.toName)}</div>
      <div class="letter-lines">${esc(l.body)}</div>
    </div>
    ${l.gotReply?`<div class="letter-paper"><div class="letter-head">${esc(l.toName)} 的回信</div><div class="letter-lines">${esc(l.replyBody)}</div></div>`:`<div style="text-align:center;color:var(--text-sub);font-size:13px;margin-bottom:10px;">${status}</div>`}
    <div class="modal-actions"><button onclick="closeModal()">關閉</button></div>`);
}

document.addEventListener('DOMContentLoaded',async ()=>{
  loadDreams(); loadProfile(); loadLetters();
  const av=await idbGet(PROFILE_AVATAR_KEY); if(av){ state.profile.avatar=av; renderAvatar(av,'topUserAvatar'); }
  renderHome();
  setInterval(()=>checkLetters(false),60000);
  checkLetters(false);
});

msgInput.addEventListener('input',()=>{ msgInput.style.height='38px'; msgInput.style.height=Math.min(msgInput.scrollHeight,110)+'px'; });
msgInput.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendText(); } });
